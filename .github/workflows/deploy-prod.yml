name: Sync Clean Code to Prod

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allows the token to push changes to your repo

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so we can switch branches smoothly

      - name: Configure Git Author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"

      - name: Strip Documentation and MD Files
        run: |
          # Remove all .md files in the root and subdirectories
          find . -name "*.md" -type f -delete
          
          # Optional: Remove an entire documentation folder if you have one
          # rm -rf docs/
          
          echo "Documentation files removed successfully."

      - name: Commit and Push to Prod Branch
        run: |
          # Switch to or create the prod branch local pointer without switching files yet
          git checkout -B prod
          
          # Add all remaining runtime files
          git add -A
          
          # Commit the changes (only if there are actual code updates)
          if git diff-index --quiet HEAD --; then
            echo "No changes to deploy."
          else
            git commit -m "chore: automated production sync & cleanup [skip ci]"
            
            # Force push to overwrite the remote prod branch with the clean version
            git push origin prod --force
          fi
